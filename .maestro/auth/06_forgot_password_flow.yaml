# AUTH-06: Forgot Password Flow
# Verifies: Navigation to forgot password, email entry, code send
appId: app.tipbox.ios
---
- clearState
- launchApp

# Skip onboarding
- assertVisible: "Atla"
- tapOn: "Atla"

# Navigate to Login
- tapOn: "Giriş Yap"
- assertVisible: "Giriş Yap"

# Tap forgot password
- tapOn: "Şifremi Unuttum"

# === FORGOT PASSWORD SCREEN ===
- assertVisible: "Şifremi Unuttum"
- assertVisible: "E-posta adresiniz"

# Enter email
- tapOn: "E-posta adresiniz"
- inputText: "${DEMO_EMAIL}"

# Tap send code
- tapOn: "Kod Gönder"

# Wait for response
- waitForAnimationToEnd
