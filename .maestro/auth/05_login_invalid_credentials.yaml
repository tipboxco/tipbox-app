# AUTH-05: Login with Invalid Credentials
# Verifies: Error toast appears, app does not crash
appId: app.tipbox.ios
---
- clearState
- launchApp

# Skip onboarding
- assertVisible: "Atla"
- tapOn: "Atla"

# Navigate to Login
- tapOn: "Giriş Yap"
- assertVisible: "Giriş Yap"

# Enter invalid credentials
- tapOn: "E-posta adresiniz"
- inputText: "wrong@email.com"

- tapOn: "Şifreniz"
- inputText: "WrongPassword123"

# Submit
- tapOn: "Onayla"

# Should show error toast
- extendedWaitUntil:
    visible: "Giriş Başarısız"
    timeout: 10000

# App should not crash -- login screen should still be visible
- assertVisible: "Giriş Yap"
