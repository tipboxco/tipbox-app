# =============================================================================
# POST-04: Create Question Post - Happy Path
# =============================================================================
# Flow: Catalog -> Select Product -> PostsScreen -> FAB -> CreatePostScreen
#       -> Select "Soru" type -> Write question text -> (optional boost)
#       -> "Paylas"
#
# Precondition: User is authenticated. Question post does NOT require
#               the product to be in inventory (users can ask about any product).
# Priority: HIGH
# =============================================================================
appId: app.tipbox.ios
name: "Post - Create Question Post Happy Path"
tags:
  - post
  - question
  - create
  - happy-path
  - priority-high

---

# ---------------------------------------------------------
# PHASE 0: Ensure app is launched and user is authenticated
# ---------------------------------------------------------
- runFlow: 00_sub_login_helper.yaml

- waitForAnimationToEnd

# ---------------------------------------------------------
# PHASE 1: Navigate to Catalog tab
# ---------------------------------------------------------
- tapOn:
    point: "50%,97%"
    label: "Tap Catalog tab (3rd icon, center position)"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Ürün Kataloğu"
    timeout: 10000

# ---------------------------------------------------------
# PHASE 2: Browse to a product
# ---------------------------------------------------------
- tapOn:
    point: "25%,42%"
    label: "Tap first category"

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Kategoriler"
    timeout: 5000

- tapOn:
    point: "17%,42%"
    label: "Tap first subcategory"

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Kategoriler"
    timeout: 5000

- tapOn:
    point: "17%,42%"
    label: "Tap first product group"

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Kategoriler"
    timeout: 5000

- tapOn:
    point: "17%,42%"
    label: "Tap first product"

- waitForAnimationToEnd

# ---------------------------------------------------------
# PHASE 3: PostsScreen -> tap Create FAB
# ---------------------------------------------------------
- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 8000

- tapOn:
    point: "90%,90%"
    label: "Tap Create FAB (green + button)"

- waitForAnimationToEnd

# ---------------------------------------------------------
# PHASE 4: Select "Soru" post type
# Question does NOT require inventory, so it should always be enabled.
# ---------------------------------------------------------
- extendedWaitUntil:
    visible:
      text: "Soru"
    timeout: 5000

- tapOn:
    text: "Soru"
    label: "Select 'Soru' (Question) post type"

- waitForAnimationToEnd

# ---------------------------------------------------------
# PHASE 5: Verify CreatePostScreen with Question fields
# ---------------------------------------------------------
- extendedWaitUntil:
    visible:
      text: "Gönderi Yaz"
    timeout: 8000
    label: "Wait for CreatePostScreen header"

# ---------------------------------------------------------
# PHASE 6: Write the question text
# Placeholder: "Sorunuzu buraya yazin..."
# ---------------------------------------------------------
- scrollUntilVisible:
    element:
      text: "Sorunuzu buraya yazın..."
    direction: DOWN
    timeout: 5000

- tapOn:
    text: "Sorunuzu buraya yazın..."
    label: "Tap question text area"

- inputText: "Bu urunun batarya omru gercekte ne kadar suruyor? Uretici 8 saat diyor ama gercek kullanim kosullarinda farkli olabilir. Kullananlarin deneyimlerini merak ediyorum. Ayrica sarj suresi hakkinda bilgi verebilir misiniz?"

- waitForAnimationToEnd

# ---------------------------------------------------------
# PHASE 7: Verify boost section is visible
# "Bu Soruyu One Cikar" section should be shown.
# We will NOT enable boost in this happy path test.
# ---------------------------------------------------------
- scrollUntilVisible:
    element:
      text: "Bu Soruyu Öne Çıkar"
    direction: DOWN
    timeout: 5000

- assertVisible:
    text: "Bu Soruyu Öne Çıkar"
    label: "Verify boost section header is visible"

# Verify available TIPS info text is shown
- scrollUntilVisible:
    element:
      text: "TIPS kullanılabilir"
    direction: DOWN
    timeout: 3000

# ---------------------------------------------------------
# PHASE 8: Submit the question post (without boost)
# Header right button: "Paylas"
# ---------------------------------------------------------
- swipe:
    direction: DOWN
    duration: 400
- tapOn:
    text: "Paylaş"
    label: "Tap 'Paylas' to submit the question post"

# Wait for success
- extendedWaitUntil:
    visible:
      text: "Soru Gönderisi Oluşturuldu"
    timeout: 15000
    label: "Wait for success toast confirming question post created"

- waitForAnimationToEnd

# Verify navigated away from create screen
- assertNotVisible:
    text: "Gönderi Yaz"
    label: "Verify CreatePostScreen is no longer visible"
