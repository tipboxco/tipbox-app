# =============================================================================
# POST-02: Create Benchmark Post - Happy Path
# =============================================================================
# Flow: Catalog -> Select Product -> PostsScreen -> FAB -> CreatePostScreen
#       -> Select "Benchmark" type -> Select 2nd product -> Choose winner
#       -> Write description -> "Paylas"
#
# Precondition: User is authenticated and has at least 1 inventory product.
#               The product must already be in the user's inventory for
#               benchmark type to be enabled.
# Priority: HIGH
# =============================================================================
appId: app.tipbox.ios
name: "Post - Create Benchmark Post Happy Path"
tags:
  - post
  - benchmark
  - create
  - happy-path
  - priority-high

---

# ---------------------------------------------------------
# PHASE 0: Ensure app is launched and user is authenticated
# ---------------------------------------------------------
- runFlow: 00_sub_login_helper.yaml

- waitForAnimationToEnd

# ---------------------------------------------------------
# PHASE 1: Navigate to Catalog tab
# ---------------------------------------------------------
- tapOn:
    point: "50%,97%"
    label: "Tap Catalog tab (3rd icon, center position)"

- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      text: "Ürün Kataloğu"
    timeout: 10000

# ---------------------------------------------------------
# PHASE 2: Browse to a product (category -> sub -> group -> product)
# ---------------------------------------------------------
- tapOn:
    point: "25%,42%"
    label: "Tap first category"

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Kategoriler"
    timeout: 5000

- tapOn:
    point: "17%,42%"
    label: "Tap first subcategory"

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Kategoriler"
    timeout: 5000

- tapOn:
    point: "17%,42%"
    label: "Tap first product group"

- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: "Kategoriler"
    timeout: 5000

- tapOn:
    point: "17%,42%"
    label: "Tap first product to open PostsScreen"

- waitForAnimationToEnd

# ---------------------------------------------------------
# PHASE 3: PostsScreen -> tap Create FAB
# ---------------------------------------------------------
- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 8000

- tapOn:
    point: "90%,90%"
    label: "Tap Create FAB (green + button)"

- waitForAnimationToEnd

# ---------------------------------------------------------
# PHASE 4: Select "Benchmark" post type from bottom sheet
# NOTE: Benchmark requires the product to be in inventory.
# If the product is NOT in inventory, this type will be disabled
# and the test will fail. This is expected behavior.
# ---------------------------------------------------------
- extendedWaitUntil:
    visible:
      text: "Benchmark"
    timeout: 5000

- tapOn:
    text: "Benchmark"
    label: "Select 'Benchmark' post type"

- waitForAnimationToEnd

# ---------------------------------------------------------
# PHASE 5: CreatePostScreen / CreateBenchmarkPostScreen
# Product 1 is pre-filled from the PostsScreen context.
# We need to: select product 2, choose winner, write description.
# ---------------------------------------------------------
- extendedWaitUntil:
    visible:
      text: "Karşılaştırma"
    timeout: 8000
    label: "Wait for Benchmark screen or Benchmark type selection"

# ---------------------------------------------------------
# PHASE 6: Select second product for comparison
# The CreatePostScreen shows two ProductSelectInput fields in benchmark mode.
# Tap the second (compare) input to open ProductPicker.
# In the unified flow, there is a DashedProductCard ("Urun Ekle") for 2nd product.
# ---------------------------------------------------------
- scrollUntilVisible:
    element:
      text: "Ürün Ekle"
    direction: DOWN
    timeout: 5000

- tapOn:
    text: "Ürün Ekle"
    label: "Tap 'Urun Ekle' dashed card to add second product"

- waitForAnimationToEnd

# Bottom sheet opens with options: "Envanterden" and "Katalogdan"
# or a combined inventory+catalog selection sheet.
# Select from inventory first.
- extendedWaitUntil:
    visible:
      text: "Envanterden"
    timeout: 5000
    label: "Wait for product source selection bottom sheet"

- tapOn:
    text: "Envanterden"
    label: "Select 'Envanterden' to pick from inventory"
    optional: true

- waitForAnimationToEnd

# Select the first product from inventory list
- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 8000
    label: "Wait for inventory list to load"

- tapOn:
    point: "50%,30%"
    label: "Tap first product in inventory list"

- waitForAnimationToEnd

# ---------------------------------------------------------
# PHASE 7: Choose the winner product
# The benchmark composer shows "Hangisini oneriyorsun?" text
# and two product cards with radio buttons.
# Tap on the first product card to select it as winner.
# ---------------------------------------------------------
- scrollUntilVisible:
    element:
      text: "Hangisini öneriyorsun?"
    direction: DOWN
    timeout: 5000

# Select product 1 (left card) as the winner
- tapOn:
    point: "25%,52%"
    label: "Tap first product card to select as winner"

- waitForAnimationToEnd

# ---------------------------------------------------------
# PHASE 8: Write comparison description
# Placeholder: "Karsilastirma aciklamanizi buraya yazin..."
# ---------------------------------------------------------
- scrollUntilVisible:
    element:
      text: "Karşılaştırma açıklamanızı buraya yazın..."
    direction: DOWN
    timeout: 5000

- tapOn:
    text: "Karşılaştırma açıklamanızı buraya yazın..."
    label: "Tap description text area"

- inputText: "Her iki urunu de 2 ay boyunca kullandiktan sonra karsilastirma yapiyorum. Ilk urun tasarim ve malzeme kalitesi acisindan daha ustun. Performans olarak da bir adim onde. Ancak ikinci urunun fiyat-performans orani daha cazip."

- waitForAnimationToEnd

# ---------------------------------------------------------
# PHASE 9: Submit the benchmark post
# Header right button: "Paylas"
# ---------------------------------------------------------
- tapOn:
    text: "Paylaş"
    label: "Tap 'Paylas' to submit the benchmark post"

# Wait for success
- extendedWaitUntil:
    visible:
      text: "Gönderi Oluşturuldu"
    timeout: 15000
    label: "Wait for success toast"

- waitForAnimationToEnd

# Verify navigated away from create screen
- assertNotVisible:
    text: "Karşılaştırma Gönderisi"
    label: "Verify benchmark create screen is no longer visible"
