# ==============================================================================
# Settings - Change Password Flow
# Precondition: User is authenticated.
# Flow: Navigate to Settings -> Change Password -> Fill fields with intentionally
#       wrong old password -> Submit -> Verify error toast/message ->
#       Test validation (empty fields, password mismatch) -> Back navigation.
# ==============================================================================
appId: app.tipbox.ios
name: "Settings - Change Password Flow with Error Handling"
tags:
  - settings
  - change-password
  - validation
  - error-handling
  - priority-high

---

# -----------------------------------------------
# Step 1: Launch app (authenticated state)
# -----------------------------------------------
- launchApp:
    clearState: false
    clearKeychain: false

- waitForAnimationToEnd

# -----------------------------------------------
# Step 2: Navigate to Settings
# -----------------------------------------------
- tapOn:
    point: "5%,6%"
    label: "Tap hamburger menu to open drawer"

- waitForAnimationToEnd

- tapOn:
    text: "Profil"
    label: "Tap Profile in drawer"

- waitForAnimationToEnd

- tapOn:
    point: "93%,7%"
    label: "Tap ellipsis icon on own profile to go to Settings"

- waitForAnimationToEnd

# -----------------------------------------------
# Step 3: Verify Settings screen loaded
# -----------------------------------------------
- assertVisible:
    text: "Ayarlar"
    label: "Settings title should be visible"

# -----------------------------------------------
# Step 4: Tap Change Password menu item
# -----------------------------------------------
- tapOn:
    text: "Şifre Değiştir"
    label: "Tap Change Password menu item"

- waitForAnimationToEnd

# -----------------------------------------------
# Step 5: Verify Change Password screen loaded
# -----------------------------------------------
- assertVisible:
    text: "Şifre Değiştir"
    label: "Change Password screen title should be visible"

- assertVisible:
    text: "Mevcut Şifre"
    label: "Current Password label should be visible"

- assertVisible:
    text: "Yeni Şifre"
    label: "New Password label should be visible"

- assertVisible:
    text: "Yeni Şifreyi Onayla"
    label: "Confirm New Password label should be visible"

- assertVisible:
    text: "Şifreyi Değiştir"
    label: "Change Password submit button should be visible"

# Verify Forgot Password link is visible
- assertVisible:
    text: "Şifremi Unuttum"
    label: "Forgot Password link should be visible"

# -----------------------------------------------
# Step 6: Test validation - Submit with empty fields
# -----------------------------------------------
- tapOn:
    text: "Şifreyi Değiştir"
    label: "Tap submit button with empty fields"

- waitForAnimationToEnd

# Validation error should appear (toast or inline)
- assertVisible:
    text: "Mevcut şifre gereklidir"
    optional: true
    label: "Current password required error should appear"

- waitForAnimationToEnd

# -----------------------------------------------
# Step 7: Fill current password only and submit (missing new password)
# -----------------------------------------------
- tapOn:
    text: "Mevcut Şifre"
    label: "Tap Current Password field"

- inputText: "WrongPassword123!"

- tapOn:
    text: "Şifreyi Değiştir"
    label: "Tap submit with only current password filled"

- waitForAnimationToEnd

# Should show new password required error
- assertVisible:
    text: "Yeni şifre gereklidir"
    optional: true
    label: "New password required error should appear"

- waitForAnimationToEnd

# -----------------------------------------------
# Step 8: Fill new password but mismatched confirm
# -----------------------------------------------
- tapOn:
    text: "Yeni Şifre"
    label: "Tap New Password field"

- inputText: "NewPass123!"

- tapOn:
    text: "Yeni Şifreyi Onayla"
    label: "Tap Confirm Password field"

- inputText: "DifferentPass456!"

- tapOn:
    text: "Şifreyi Değiştir"
    label: "Tap submit with mismatched passwords"

- waitForAnimationToEnd

# Passwords must match error
- assertVisible:
    text: "Şifreler eşleşmelidir"
    optional: true
    label: "Passwords must match error should appear"

- waitForAnimationToEnd

# -----------------------------------------------
# Step 9: Fill all fields correctly but with WRONG old password
# -----------------------------------------------
# Clear all fields first
- tapOn:
    text: "Mevcut Şifre"
    label: "Tap Current Password to clear"

- eraseText: 50
- inputText: "TotallyWrongOldPassword999!"

- tapOn:
    text: "Yeni Şifre"
    label: "Tap New Password to clear"

- eraseText: 50
- inputText: "NewValidPass123!"

- tapOn:
    text: "Yeni Şifreyi Onayla"
    label: "Tap Confirm Password to clear"

- eraseText: 50
- inputText: "NewValidPass123!"

# -----------------------------------------------
# Step 10: Submit with wrong old password
# Backend should return an error
# -----------------------------------------------
- tapOn:
    text: "Şifreyi Değiştir"
    label: "Tap submit with wrong old password"

- waitForAnimationToEnd

# Wait for API response - expect error toast
# The button text changes to "Degistiriliyor..." while pending
- extendedWaitUntil:
    visible:
      text: "Şifreyi Değiştir"
    timeout: 10000

# Error toast should appear from backend
- assertVisible:
    text: "Hata"
    optional: true
    label: "Error toast should appear for wrong old password"

- waitForAnimationToEnd

# -----------------------------------------------
# Step 11: Navigate back to Settings
# -----------------------------------------------
- tapOn:
    point: "10%,7%"
    label: "Tap back button to return to Settings"

- waitForAnimationToEnd

- assertVisible:
    text: "Ayarlar"
    label: "Should be back on Settings screen"
